
name: Build Ghuo Visual

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project
        run: |
          mkdir source
          unzip -q "$(find . -maxdepth 1 -name '*.zip' | head -n 1)" -d source
          echo "PROJECT_DIR=$(dirname "$(find source -name gradlew -type f | head -n 1)")" >> "$GITHUB_ENV"

      - name: Build mod
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: GhuoVisual-JAR
          path: source/**/build/libs/*.jar
